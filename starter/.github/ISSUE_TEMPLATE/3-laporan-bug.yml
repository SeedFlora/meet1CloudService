name: Laporan bug
description: Ada yang tidak berjalan di Cloud Model Lab atau dokumentasinya keliru.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: masalah
    attributes:
      label: Apa yang terjadi?
      description: Tulis juga apa yang seharusnya terjadi.
    validations:
      required: true
  - type: textarea
    id: langkah
    attributes:
      label: Langkah untuk mereproduksi
      placeholder: |
        1. Buka halaman ...
        2. Klik ...
  - type: dropdown
    id: lingkungan
    attributes:
      label: Di mana terjadi?
      options:
        - Vercel (production)
        - Vercel (preview)
        - npm run dev (lokal)
        - Lainnya
  - type: input
    id: url
    attributes:
      label: URL deployment (kalau ada)
