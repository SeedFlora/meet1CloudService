# CI sederhana: setiap push dan pull request menjalankan `npm test`.
# Hasilnya terlihat di tab Actions (centang hijau / silang merah).
name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
